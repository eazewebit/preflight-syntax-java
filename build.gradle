plugins {
    id 'java-library'
    id 'org.owasp.dependencycheck' version '10.0.4'
    id 'jacoco'
}
group = 'com.neel'
version = '1.0.0'

description = 'A pluggable Java library that validates the syntactic correctness of proposed source-code modifications before they are applied.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.12.2'
    assertjVersion = '3.27.7'
    mockitoVersion = '5.16.1'
    slf4jVersion = '2.0.13'
}

dependencies {
    // Logging API – compile-only facade; consumers provide their own SLF4J implementation.
    compileOnly "org.slf4j:slf4j-api:${slf4jVersion}"

    // Archive extraction (tar.gz, tar.xz) – used by BinaryManager
    implementation 'org.apache.commons:commons-compress:1.28.0'
    runtimeOnly 'org.tukaani:xz:1.10'

    // SLF4J implementation for standalone application (fat JAR)
    runtimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"

    testImplementation "org.slf4j:slf4j-nop:${slf4jVersion}"
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
}

// OWASP Dependency-Check – fail only on critical (CVSS >= 9) vulnerabilities
dependencyCheck {
    failBuildOnCVSS = 9.0f
    analyzers {
        nodeEnabled = false
    }
    formats = ['HTML', 'JSON']
}

// JaCoCo code-coverage
jacoco {
    toolVersion = '0.8.13'
}

tasks.withType(Test).configureEach {
    jacoco {
        excludes = [
            'sun.**',
            'com.sun.**',
            'org.jcp.**',
            'jdk.**',
            'java.**',
            'javax.**',
            'org.gradle.**',
            'worker.org.gradle.**',
            'org.apache.**',
            'org.junit.**',
            'org.mockito.**',
            'net.bytebuddy.**',
            'org.opentest4j.**'
        ]
    }
}

jacocoTestReport {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect { fileTree(dir: it, exclude: ['sun/**', 'com/sun/**', 'org/jcp/**', 'jdk/**', 'java/**', 'javax/**', 'org/gradle/**']) }))
    }
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    finalizedBy jacocoTestReport
}

tasks.named('javadoc') {
    options {
        encoding = 'UTF-8'
    }
}


// Fat JAR (all classifier) – bundles all runtime dependencies into a single archive
tasks.register('shadowJar', Jar) {
    archiveClassifier.set('all')
    archiveBaseName.set('syntax-validation')
    archiveVersion.set('1.0.0')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest {
        attributes 'Implementation-Title': 'syntax-validation',
                   'Implementation-Version': '1.0.0'
    }
}

